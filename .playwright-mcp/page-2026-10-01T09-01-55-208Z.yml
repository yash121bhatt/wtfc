            - paragraph [ref=f12e187]: What We Offer
            - heading "Diversity that Delivers" [level=2] [ref=f12e188]
            - paragraph [ref=f12e189]: From mentorship to advocacy, from youth engagement to professional standards — our programs turn good intentions into measurable change across every level of the industry.
          - list [ref=f12e190]:
            - listitem [ref=f12e191]:
              - generic [ref=f12e195]:
                - heading "Mentorship & Retention" [level=3] [ref=f12e196]
                - paragraph [ref=f12e197]: Paired with an experienced driver, mentor, or executive for at least six months. We have matched thousands of women with the people who keep them moving forward.
            - listitem [ref=f12e198]:
              - generic [ref=f12e203]:
                - heading "Youth & Schools" [level=3] [ref=f12e204]
                - paragraph [ref=f12e205]: Careers in Motion brings WTFC into classrooms, giving students a real look at modern trucking — technology, logistics, and the people behind it.
            - listitem [ref=f12e206]:
              - generic [ref=f12e220]:
                - heading "Advocacy & Policy" [level=3] [ref=f12e221]
                - paragraph [ref=f12e222]: We bring industry voices into the room on safety, fair opportunity, and the recognition of drivers as skilled professionals.
            - listitem [ref=f12e223]:
              - generic [ref=f12e228]:
                - heading "Professional Standards" [level=3] [ref=f12e229]
                - paragraph [ref=f12e230]: A public campaign promoting respect, safe practices, and professional conduct on and off the road.
      - generic [ref=f12e233]:
        - generic [ref=f12e234]:
          - heading "Safety. Equity. Accountability. That's our road forward." [level=2] [ref=f12e235]
          - paragraph [ref=f12e236]: The Women's Trucking Federation of Canada (WTFC) is building a stronger, safer, and more inclusive trucking industry. We champion women and underrepresented groups, expand career pathways, and advocate for drivers as skilled professionals who deserve respect, recognition, and safe working conditions.
          - paragraph [ref=f12e237]: "Our mission is to:"
          - list [ref=f12e238]:
            - listitem [ref=f12e239]:
              - paragraph [ref=f12e244]: Elevate Standards — modernizing training, credentialing, and professional development across the industry
            - listitem [ref=f12e245]:
              - paragraph [ref=f12e250]: Promote Safety — leading public awareness campaigns and tackling the real-world safety challenges drivers face
            - listitem [ref=f12e251]:
              - paragraph [ref=f12e258]: Build Community — fostering mentorship, retention, and allyship across fleets, terminals, classrooms, and boardrooms
          - paragraph [ref=f12e259]: By uniting drivers, industry leaders, and allies, WTFC is reshaping Canadian trucking where equity, safety, and professionalism aren't goals, they're the baseline.
          - link "Learn More" [ref=f12e260] [cursor=pointer]:
            - /url: /en/about
