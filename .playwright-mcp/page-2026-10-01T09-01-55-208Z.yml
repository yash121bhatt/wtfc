          - heading "Driving Change in Canada's Trucking Industry" [level=1] [ref=f12e53]
          - paragraph [ref=f12e54]: And we hope you will join us as we shape the future of trucking.
          - paragraph [ref=f12e55]: The Women's Trucking Federation of Canada (WTFC) is a national non-profit advancing safety, opportunity, and inclusion across the trucking sector. We empower women, engage youth, and unite drivers, technicians, trainers, executives, and male allies to build a modern, resilient, and diverse industry. Since 2016, we've grown into a powerful network grounded in mentorship, advocacy, and real-world impact — because this is not just an organization, it's a community.
